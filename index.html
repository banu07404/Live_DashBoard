<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background: #f4f4f4;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: #fff;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: left;
    }
    th {
      background: #007acc;
      color: white;
    }
    tr:nth-child(even) {
      background: #f9f9f9;
    }
  </style>
</head>
<body>
  <h1>📊 Live Google Sheet Dashboard</h1>
  <table id="data-table"></table>

  <script>
    // Replace with your published CSV link
    const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRSafWeGHipxKseCSWdr-b2boejcaWjIhYpTbg5Pr8vmQgqiuR-RWYQN0gBp9-KfFlJeILvabznIJg4/pub?output=csv";

    fetch(sheetUrl)
      .then(response => response.text())
      .then(data => {
        const rows = data.split("\n").map(row => row.split(","));
        const table = document.getElementById("data-table");

        // Build table header
        let headerRow = document.createElement("tr");
        rows[0].forEach(header => {
          let th = document.createElement("th");
          th.textContent = header;
          headerRow.appendChild(th);
        });
