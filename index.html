<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Financial Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background: #f4f6f8; }
    h1 { text-align: center; color: #2c3e50; }
    table { width: 80%; margin: 20px auto; border-collapse: collapse; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    th, td { padding: 12px; border: 1px solid #ddd; text-align: center; }
    th { background: #3498db; color: #fff; }
    tr:nth-child(even) { background: #f9f9f9; }
    #status { text-align: center; margin-top: 20px; font-weight: bold; color: #27ae60; }
  </style>
</head>
<body>
  <h1>📊 Financial Dashboard</h1>
  <div id="status">Loading data from Google Sheets...</div>
  <table id="dataTable">
    <thead>
      <tr id="headerRow"></tr>
    </thead>
    <tbody></tbody>
  </table>

  <!-- Tabletop.js library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tabletop.js/1.5.4/tabletop.min.js"></script>
  <script>
    // Use your published sheet link with headers=true
    var publicSpreadsheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRyaZUuLTaziWrIaf1-ZMAvJm7NYLTJg71JcSQ-zWDTqPsDvUhbUyT1OH4pE_gGuA/pubhtml?gid=124749958&single=true&headers=true';

    function init() {
      Tabletop.init({
        key: publicSpreadsheetUrl,
        callback: showInfo,
        simpleSheet: true
      });
    }

    function showInfo(data, tabletop) {
      const tbody = document.querySelector("#dataTable tbody");
      const headerRow = document.querySelector("#headerRow");
      tbody.innerHTML = "";
      headerRow.innerHTML = "";

      // Auto-generate headers from sheet
      const keys = Object.keys(data[0]);
      keys.forEach(key => {
        let th = document.createElement("th");
        th.textContent = key;
        headerRow.appendChild(th);
      });

      // Populate rows dynamically
      data.forEach(row => {
        let tr = document.createElement("tr");
        keys.forEach(key => {
          let td = document.createElement("td");
          if (row[key] && row[key].startsWith("http")) {
            td.innerHTML = `<a href="${row[key]}" target="_blank">View File</a>`;
          } else {
            td.textContent = row[key] || "";
          }
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });

      document.getElementById("status").textContent = "✅ Data loaded successfully!";
      console.log("Row keys:", keys); // Debugging
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
